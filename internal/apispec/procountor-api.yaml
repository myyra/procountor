          schema:
            type: integer
          example: 123456
        - name: includeInactive
          in: query
          description: Include inactive persons
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/page"
        - name: orderById
          in: query
          description: Order the results by Person ID
          required: false
          schema:
            type: string
            default: DESC
            enum:
              - ASC
              - DESC
          example: ASC
      responses:
        "200":
