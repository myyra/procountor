openapi: 3.1.0
info:
  version: 25.12.0
  title: Procountor API
servers:
  - url: "https://nemo.procountor.com/api"
tags:
  - name: Auth
    description: Authentication, login, and token exchange.
  - name: Invoices
    description: Create, update, search, and manage invoices.
  - name: Business partners
    description: Search and manage business partners and partner groups.
  - name: Ledger receipts
    description: Read and manage ledger receipts and related workflow actions.
  - name: Attachments
    description: Upload, download, and manage attachments.
  - name: Dimensions
    description: Work with dimensions and dimension items.
  - name: Products
    description: Product listing endpoints.
  - name: Persons
    description: Search and manage persons.
  - name: Reports
    description: Generate reports.
  - name: Cost receipts
    description: Create and manage cost receipts.
  - name: Cost centers
    description: Cost center lookup endpoints.
  - name: Chart of accounts
    description: Chart of accounts lookup endpoints.
  - name: Company
    description: Company information endpoints.
  - name: Fiscal years
    description: Fiscal year lookup endpoints.
  - name: VATs
    description: VAT settings and lookup endpoints.
paths:
  /attachments:
    post:
      operationId: saveAttachment
      summary: Add a new attachment.
      description: "Using this endpoint you can add an attachment. The attachment can be of any type but limited to max 10000000 bytes. Content-type for the request is multipart/form-data. Type for the meta data is application/json, see Attachment model."
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                meta:
                  $ref: "#/components/schemas/Attachment"
                file:
                  type: string
                  format: binary
              required:
                - file
                - meta
      responses:
        "200":
          description: Attachment was successfully added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Attachments
  "/attachments/{attachmentId}":
    patch:
      operationId: renameAttachment
      summary: Renames an attachment.
      description: Renames an attachment based on the given attachment ID. The file extension can't be changed. Other properties than the filename can't be changed.
      parameters:
        - name: name
          in: query
          description: Name of the attachment file
          schema:
            type: string
          example: example-pdf2.pdf
        - name: attachmentId
          in: path
          description: ID of the attachment
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentRename"
      responses:
        "200":
          description: Attachment was successfully renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Attachments
    delete:
      operationId: deleteAttachment
      summary: Delete an attachment.
      description: Deletes an attachment based on a given attachment ID.
      parameters:
        - name: attachmentId
          in: path
          description: ID of the attachment
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Attachment was successfully deleted.
          content:
            application/json:
              schema:
                type: object
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Attachments
  "/attachments/{attachmentId}/content":
    get:
      operationId: getAttachmentContent
      summary: Get attachment content.
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/BinaryContentResponse"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Attachments
  /businesspartners:
    get:
      operationId: searchBusinessPartners
      summary: Finds business partners matching search criteria.
      description: "Returns basic information: register id, name, billing address, id, customer no, partner type, active/inactive. This endpoint supports name and identifier parameters in HTTP header."
      parameters:
        - name: identifierType
          in: query
          description: Business identifier type of the partner
          schema:
            type: string
          example: FN
        - name: customerNumber
          in: query
          description: Customer number
          schema:
            type: string
          example: "100015"
        - name: mainGroup
          in: query
          description: Main group
          schema:
            type: string
          example: Main
        - name: partnerGroup
          in: query
          description: Business Partner Group
          schema:
            type: string
          example: Export/Import
        - name: type
          in: query
          description: Type of business partner
          schema:
            type: string
            enum:
              - CUSTOMER
              - SUPPLIER
              - PERSON
          example: CUSTOMER
        - name: orderById
          in: query
          description: Order the results by invoice ID
          schema:
            type: string
            default: DESC
            enum:
              - ASC
              - DESC
          example: ASC
        - name: previousId
          in: query
          description: Previous invoice ID for pagination
          schema:
            type: integer
          example: 123456
        - name: active
          in: query
          description: Status of business partner
          schema:
            type: boolean
            default: true
        - name: versionStartDate
          in: query
          description: Start date of the search (business partner updated date)
          schema:
            type: string
            format: date-time
            x-ogen-time-format: 2006-01-02T15:04:05
          example: "2016-08-31T00:00:00Z"
        - name: versionEndDate
          in: query
          description: End date of the search (business partner updated date)
          schema:
            type: string
            format: date-time
            x-ogen-time-format: 2006-01-02T15:04:05
          example: "2016-12-31T00:00:00Z"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/page"
      responses:
        "200":
          description: Invoices were successfully found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessPartnerSearchResult"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Business partners
  /businesspartners/groups:
    get:
      operationId: getPartnerGroups
      summary: Finds business partners groups matching search criteria.
      description: Returns business partner groups ordered by group ID.
      parameters:
        - name: name
          in: query
          description: Business partner group name. Uses substring matching.
          schema:
            type: string
          example: Test group
        - name: type
          in: query
          description: Business partner group type.
          schema:
            type: string
            enum:
              - CUSTOMER
              - SUPPLIER
              - PERSON
          example: CUSTOMER
        - name: active
          in: query
          description: Status of business partner group.
          schema:
            type: boolean
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/page"
      responses:
        "200":
          description: Business partner groups were successfully returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessPartnerGroupSearchResult"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Business partners
    post:
      operationId: createBusinessPartnerGroup
      summary: Create a new business partner group.
      description: Create a new business partner group with given data.
      requestBody:
        description: Business partner group data to add
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessPartnerGroup"
      responses:
        "200":
          description: Business partner group was successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessPartnerGroup"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Business partners
  "/businesspartners/groups/{id}":
    get:
      operationId: getPartnerGroup
      summary: Get business partners group.
      description: Returns business partner group with requested group ID.
      parameters:
        - name: id
          in: path
          description: ID of the partner group
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Business partner group were successfully returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessPartnerGroup"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Business partners
    put:
      operationId: updateBusinessPartnerGroup
      summary: Update a business partner group.
      description: Update a business partner group data.
      parameters:
        - name: id
          in: path
          description: Business partner group identifier
          required: true
          schema:
            type: integer
      requestBody:
        description: Business partner group data to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessPartnerGroup"
      responses:
        "200":
          description: Business partner group was successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessPartnerGroup"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Business partners
  /businesspartners/personaldetails:
    get:
      operationId: getPersonalDetails
      summary: Get person details for the current user.
      description: "Returns basic information from the person register for the currently logged in user. Includes eg. name, address, invoicing information and payment information. For more information, you can call GET /persons/{id}"
      responses:
        "200":
          description: Person details were successfully returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalDetails"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Business partners
  "/businesspartners/{id}":
    get:
      operationId: getBusinessPartner
      summary: Get a business partner.
      description: Endpoint returns BusinessPartner for given id with all details. Also accepts multiple comma-separated ids. Max 200 ids per request.
      parameters:
        - name: id
          in: path
          description: ID of the business partner
          required: true
          schema:
            type: string
            format: multi
      responses:
        "200":
          description: The partner was successfully returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessPartner"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Business partners
    put:
      operationId: putBusinessPartner
      summary: Update a business partner.
      description: PUT /businesspartners/<id> replaces all the details of an existing business partner. Use PATCH /businesspartners/<id> if you need the previous functionality to update values of specific fields only.
      parameters:
        - name: id
          in: path
          description: Business partner identifier
          required: true
          schema:
            type: integer
      requestBody:
        description: Business partner data to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessPartner"
      responses:
        "200":
          description: Business partner was successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessPartner"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Business partners
    patch:
      operationId: updateBusinessPartner
      summary: Update a business partner.
      description: "Supported customer and supplier business partners. The fields that are supported are: id, name, type (CUSTOMER and SUPPLIER only), address (but NOT billing address nor delivery address), invoicing info and payment info. To update a partner, it's required to provide version, which is the last modification time. It can be provided as query param or in request body."
      parameters:
        - name: id
          in: path
          description: Business partner identifier
          required: true
          schema:
            type: integer
        - name: version
          in: query
          description: Business partner last modification time. It is required if not filled in the request body.
          required: false
          schema:
            type: string
      requestBody:
        description: Business partner data to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessPartner"
      responses:
        "200":
          description: Business partner was successfully updated.
          content:
            application/json:
              schema:
                type: object
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Business partners
  "/businesspartners/{id}/defaults/accounts":
    get:
      operationId: getDefaultAccounts
      summary: Get default accounts of business partner.
      description: Returns default accounts for a business partner with the given ID with vat information. Default accounts are not available for business partner type 'PERSON'
      parameters:
        - name: id
          in: path
          description: ID of the business partner
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Default accounts were successfully returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessPartnerDefaultAccounts"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Business partners
  /coa:
    get:
      operationId: getChartOfAccount
      summary: Get the chart of accounts.
      description: Returns the chart of accounts for the current environment. It can be modified on the Chart of accounts page in Procountor.
      responses:
        "200":
          description: The chart of accounts was successfully returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerAccounts"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      externalDocs:
        url: "https://support.procountor.fi/hc/en-us/articles/360019455298-Chart-of-accounts"
      tags:
        - Chart of accounts
  /company:
    get:
      operationId: getCompanyInfo
      summary: Get current company info.
      description: Returns basic information of the currently logged in company.
      responses:
        "200":
          description: Company info was successfully returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyInfoResponse"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Company
  "/costcenter/{ledgerReceiptId}":
    get:
      operationId: getCostCenter
      summary: Get cost center dimension values.
      parameters:
        - name: ledgerReceiptId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cost center was successfully returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostCenter"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Cost centers
  /costreceipt:
    get:
      operationId: searchCostReceipts
      summary: Search cost receipts.
      parameters:
        - name: createdStartDate
          in: query
          description: Start date of the search (created date).
          required: false
          schema:
            type: string
            format: date
          example: "2024-01-27"
      responses:
        "200":
          description: Cost receipts were successfully found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostReceiptSearchResult"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Cost receipts
    post:
      operationId: createCostReceipt
      summary: Create a new cost receipt.
      requestBody:
        description: Cost receipt data to save
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostReceipt"
      responses:
        "201":
          description: Cost receipt was successfully saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostReceipt"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Cost receipts
  "/costreceipt/{costReceiptId}":
    get:
      operationId: getCostReceipt
      summary: Get a cost receipt.
      parameters:
        - name: costReceiptId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cost receipt was successfully returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostReceipt"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Cost receipts
  /dimensions:
    get:
      operationId: getDimensions
      summary: Get all dimensions with dimension items.
      description: Returns a list of all dimensions and dimension items for the current company. Dimensions can be set on the Dimensions page in Procountor.
      parameters:
        - name: name
          in: query
          description: Name of the dimension. Supports partial search.
          required: false
          schema:
            type: string
        - name: codeName
          in: query
          description: Name of the dimension item. Supports partial search.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Dimensions were successfully returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dimension"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      externalDocs:
        url: "https://support.procountor.fi/hc/en-us/articles/360000241838-Dimensioning"
      tags:
        - Dimensions
  "/dimensions/{dimensionId}":
    get:
      operationId: getDimension
      summary: Get a dimension with dimension items.
      description: Returns a specified dimension with its dimension items.
      parameters:
        - name: dimensionId
          in: path
          description: Dimension identifier
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dimensions were successfully returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dimension"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Dimensions
    put:
      operationId: updateDimension
      summary: Update dimension.
      description: This endpoint allows to update a dimension name
      parameters:
        - name: dimensionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DimensionName"
      responses:
        "200":
          description: The dimension was successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DimensionName"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Dimensions
  "/dimensions/{dimensionId}/items":
    post:
      operationId: addDimensionItem
      summary: Create a new item for dimension.
      description: This endpoint creates a new item for dimension identified by id.
      parameters:
        - name: dimensionId
          in: path
          description: Dimension identifier
          required: true
          schema:
            type: integer
      requestBody:
        description: Dimension item data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DimensionItem"
      responses:
        "200":
          description: The dimension was successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DimensionItem"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Dimensions
    put:
      operationId: updateDimensionItem
      summary: Update item in dimension.
      description: This endpoint modifies an item for dimension identified by id.
      parameters:
        - name: dimensionId
          in: path
          description: Dimension identifier
          required: true
          schema:
            type: integer
      requestBody:
        description: Dimension item data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DimensionItem"
      responses:
        "200":
          description: The dimension was successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DimensionItem"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Dimensions
  /fiscalyears:
    get:
      operationId: getFiscalYears
      summary: List fiscal years.
      description: "Lists fiscal years ordered by their start date, from newest to oldest. Tracking periods, if exist, are in chronological order. Fiscal years can be edited on the Fiscal years page in Procountor."
      responses:
        "200":
          description: Fiscal years were successfully returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalYears"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      externalDocs:
        url: "http://support.procountor.com/en/kirjanpito/tilikaudet.html."
      tags:
        - Fiscal years
  /invoices:
    get:
      operationId: searchInvoice
      summary: Search invoices.
      description: "Search invoices. Returns a list containing basic information for the invoices. The ID in each result entry can be used to fetch complete invoice details with the GET /invoices/{invoiceId} endpoint. Supports purchase, purchase order, sales, sales order, self-assessed tax, travel and expense (bill of charges) invoices."
      parameters:
        - name: status
          in: query
          description: Invoice status
          schema:
            type: array
            items:
              type: string
              format: multi
              enum:
                - EMPTY
                - UNFINISHED
                - NOT_SENT
                - SENT
                - RECEIVED
                - PAID
                - PAYMENT_DENIED
                - VERIFIED
                - APPROVED
                - INVALIDATED
                - PAYMENT_QUEUED
                - PARTLY_PAID
                - PAYMENT_SENT_TO_BANK
                - MARKED_PAID
                - STARTED
                - INVOICED
                - OVERRIDDEN
                - DELETED
                - UNSAVED
                - PAYMENT_TRANSACTION_REMOVED
          example:
            - UNFINISHED
        - name: startDate
          in: query
          description: Start date of the search (invoice billing date)
          schema:
            type: string
            format: date
          example: "2016-08-31"
        - name: endDate
          in: query
          description: End date of the search (invoice billing date)
          schema:
            type: string
            format: date
          example: "2016-08-31"
        - name: createdStartDate
          in: query
          description: Start date of the search (invoice created date)
          schema:
            type: string
            format: date-time
            x-ogen-time-format: 2006-01-02T15:04:05
          example: "2016-08-31T00:00:00"
        - name: createdEndDate
          in: query
          description: End date of the search (invoice created date)
          schema:
            type: string
            format: date-time
            x-ogen-time-format: 2006-01-02T15:04:05
          example: "2016-12-31T00:00:00"
        - name: versionStartDate
          in: query
          description: Start date of the search (invoice updated date)
          schema:
            type: string
            format: date-time
            x-ogen-time-format: 2006-01-02T15:04:05
          example: "2016-08-31T00:00:00"
        - name: versionEndDate
          in: query
          description: End date of the search (invoice updated date)
          schema:
            type: string
            format: date-time
            x-ogen-time-format: 2006-01-02T15:04:05
          example: "2016-12-31T00:00:00"
        - name: dueStartDate
          in: query
          description: Start date of the search (invoice due date)
          schema:
            type: string
            format: date
          example: "2016-08-31"
        - name: dueEndDate
          in: query
          description: End date of the search (invoice due date)
          schema:
            type: string
            format: date
          example: "2016-12-31"
        - name: types
          in: query
          description: "Invoice types. Supports more than one invoice status, separated by comma"
          schema:
            type: array
            items:
              type: string
              format: multi
              enum:
                - PERIODIC_TAX_RETURN
                - PURCHASE_INVOICE
                - PURCHASE_ORDER
                - SALES_INVOICE
                - SALES_ORDER
                - TRAVEL_INVOICE
                - BILL_OF_CHARGES
          example:
            - SALES_INVOICE
        - name: businessPartnerId
          in: query
          description: Search invoices with given business partner ID
          schema:
            type: integer
          example: 123456
        - name: factoringContractId
          in: query
          description: Search invoices with given factoring contract Id
          schema:
            type: integer
          example: 123456
        - name: originalInvoiceNumber
          in: query
          description: Search invoices with given original invoice number
          schema:
            type: string
          example: "123456"
        - name: invoiceNumber
          in: query
          description: Search invoices with given invoice number
          schema:
            type: integer
          example: 123456
        - name: searchTerm
          in: query
          description: "Search invoices by searchTerm. Allows searching by counterpartyAddress.name, invoiceNumber and additionalInformation."
          schema:
            type: string
          example: Name1
        - name: previousId
          in: query
          description: Previous invoice ID for pagination
          schema:
            type: integer
          example: 123456
        - name: orderById
          in: query
          description: Order the results by invoice ID
          schema:
            type: string
            default: DESC
            enum:
              - ASC
              - DESC
          example: ASC
        - name: orderByDate
          in: query
          description: Order the results by date
          schema:
            type: string
            default: DESC
            enum:
              - ASC
              - DESC
          example: ASC
        - name: orderByCreated
          in: query
          description: Order the results by created date
          schema:
            type: string
            default: DESC
            enum:
              - ASC
              - DESC
          example: ASC
        - name: orderByVersion
          in: query
          description: Order the results by version (updated date)
          schema:
            type: string
            default: DESC
            enum:
              - ASC
              - DESC
          example: ASC
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/page"
        - name: invoiceChannel
          in: query
          description: Invoice channel
          schema:
            type: array
            items:
              type: string
              format: multi
              enum:
                - EMAIL
                - MAIL
                - ELECTRONIC_INVOICE
                - EDIFACT
                - PAPER_INVOICE
                - NO_SENDING
          example:
            - EMAIL
      responses:
        "200":
          description: Invoices were successfully found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceSearchResult"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Invoices
    post:
      operationId: saveInvoice
      summary: Create a new invoice.
      description: "Supports expense claim, purchase, sales, sales order, purchase order and travel invoices."
      parameters:
        - name: addCollectionPenalCosts
          in: query
          description: "Supported only for SALES_INVOICE type. Default is false. If true, automatically adds the collection cost(s), if payment reminders were sent earlier to the business partner and/or penal cost, if the business partner had paid the earlier invoice late. These costs are added only if Automatic handling of collection and penal costs setting is enabled, and collection costs product and penal expense product have been defined."
          required: false
          schema:
            type: boolean
      requestBody:
        description: Invoice data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Invoice"
      responses:
        "200":
          description: The invoice was successfully saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Invoices
