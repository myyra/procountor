          type: boolean
        excludingVatTotal:
          description: Total Excluding VAT for all invoice rows.
          type: number
        vatSumTotal:
          description: Total VAT sum for all invoice rows.
          type: number
        invoiceSumTotal:
          description: Sum of excludingVatTotal and vatSumTotal in accounting currency or invoice currency.
          type: number
      readOnly: true
    InvoiceTransaction:
